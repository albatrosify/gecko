name: Rust Build

on:
  push:
    branches:
      - develop
      - feat/rust-remake
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/albatrosify/gecko

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push by digest
        uses: ./.github/actions/build-by-digest
        with:
          platform: ${{ matrix.platform }}
          dockerfile: Dockerfile.rust
          app_version: rust
          registry_image: ${{ env.REGISTRY_IMAGE }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          digest_artifact_name: digests-${{ strategy.job-index }}

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge manifest
        uses: ./.github/actions/merge-manifest
        with:
          registry_image: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=rust
            type=sha,prefix=rust-
          inspect_tag: rust
          github_token: ${{ secrets.GITHUB_TOKEN }}
