name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  REGISTRY_IMAGE: ghcr.io/albatrosify/gecko

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version label
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        uses: ./.github/actions/build-by-digest
        with:
          platform: ${{ matrix.platform }}
          app_version: ${{ steps.version.outputs.app_version }}
          registry_image: ${{ env.REGISTRY_IMAGE }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          digest_artifact_name: digests-${{ strategy.job-index }}

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge manifest
        uses: ./.github/actions/merge-manifest
        with:
          registry_image: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest
          inspect_tag: ""
          github_token: ${{ secrets.GITHUB_TOKEN }}
