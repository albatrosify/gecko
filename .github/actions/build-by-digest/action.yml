name: Build and push by digest
description: >
  Set up Buildx, log in to GHCR, build a single-platform image, push it by digest
  and upload the digest as an artifact (consumed by the merge job). Shared by the
  dev and release pipelines so the build steps live in one place.

inputs:
  platform:
    description: Target platform (e.g. linux/amd64)
    required: true
  app_version:
    description: Value for the VITE_APP_VERSION build arg
    required: true
  registry_image:
    description: Fully qualified image name without tag
    required: true
  github_token:
    description: Token used to log in to GHCR
    required: true
  digest_artifact_name:
    description: Name of the uploaded digest artifact
    required: true

runs:
  using: composite
  steps:
    - name: Set short SHA
      id: sha
      shell: bash
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.registry_image }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,"name=${{ inputs.registry_image }}",push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=build-${{ inputs.platform }}
        cache-to: type=gha,mode=max,scope=build-${{ inputs.platform }}
        build-args: |
          VITE_APP_VERSION=${{ inputs.app_version }}
          VITE_APP_COMMIT_HASH=${{ steps.sha.outputs.short_sha }}

    - name: Export digest
      shell: bash
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "Invalid or empty digest: '$digest'" >&2
          exit 1
        fi
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.digest_artifact_name }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
